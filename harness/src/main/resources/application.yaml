server:
  port: 8081

spring:
  banner:
    charset: UTF-8
  application:
    name: castiel

logging:
  level:
    # Harness at INFO, everything else quiet: the default console shows the
    # banner, MCP connections and the UI line without Spring/Netty chatter.
    root: WARN
    io.github.iso53.castiel: INFO

---
# Active when launched with --debug (CastielApplication enables the "debug" profile).
spring:
  config:
    activate:
      on-profile: debug

logging:
  level:
    io.github.iso53.castiel: DEBUG
    dev.langchain4j: DEBUG # langchain4j core + the MCP client module
    reactor.netty: WARN # keep the noisy reactive stack quiet even in debug mode
    reactor.core: WARN
